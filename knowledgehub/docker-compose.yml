name: knowledgehub

# 镜像说明：国内网络直连 Docker Hub 不可达，全部镜像使用 m.daocloud.io 加速前缀，
# 上游原始引用见各行注释；m.daocloud.io 已加入 Docker Desktop 代理排除列表（直连）。

services:
  # ---------- MongoDB：权威数据源 + Outbox ----------
  # 单节点副本集以启用多文档事务（Transactional Outbox 依赖）
  mongodb:
    image: m.daocloud.io/docker.io/library/mongo:7.0  # mongo:7.0
    container_name: kh-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 一次性副本集初始化；重复执行幂等（已初始化则跳过）
  mongodb-init:
    image: m.daocloud.io/docker.io/library/mongo:7.0  # mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - mongodb://mongodb:27017
      - --eval
      - |
        try {
          const s = rs.status();
          if (s.ok !== 1) { throw new Error("not initiated"); }
          print("replica set already initiated");
        } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
          print("replica set initiated");
        }

  redis:
    image: m.daocloud.io/docker.io/library/redis:7-alpine  # redis:7-alpine
    container_name: kh-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: m.daocloud.io/docker.io/library/neo4j:5-community  # neo4j:5-community
    container_name: kh-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-knowledgehub123}
      # 开发机内存约束（16GB 机器全栈启动）
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Milvus Standalone（官方 v3.0.2 模板，profile=milvus） ----------
  # 阶段 0 网络妥协：m.daocloud.io 对 minio/minio 全仓库 403（quay 通道同样），
  # Docker Hub/1ms.run 均不可用，故 standalone 暂以 COMMON_STORAGETYPE=local
  # （本地文件系统对象存储）运行——这是 Milvus standalone 的合法配置；
  # milvus-minio 服务保留在 profile=minio-storage 下，镜像可拉取后恢复 remote 模式：
  #   1) docker compose --profile milvus --profile minio-storage up -d
  #   2) 恢复 MINIO_ADDRESS 与 depends_on，COMMON_STORAGETYPE 改回 remote
  # 注意：milvus-minio 是 Milvus 内部对象存储，不对外映射端口，
  # 与后续可选的业务文件存储 minio 是两回事（设计文档 §9.1）。
  milvus-etcd:
    image: m.daocloud.io/quay.io/coreos/etcd:v3.5.25  # quay.io/coreos/etcd:v3.5.25
    profiles: ["milvus"]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: m.daocloud.io/docker.io/minio/minio:RELEASE.2024-05-28T17-19-04Z  # minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: ["minio-storage"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: m.daocloud.io/docker.io/milvusdb/milvus:v3.0.2  # milvusdb/milvus:v3.0.2
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy

  # ---------- 应用层（profile=app）：API / 前端 / 发布器 / 双 Worker ----------
  # 容器网络内直连服务名（副本集成员注册名 mongodb 可解析，无需 directConnection）；
  # 数据库仍在各自 profile 中，需同时启用：docker compose --profile milvus --profile app up -d
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-knowledgehub123}
      MILVUS_URI: http://milvus-standalone:19530
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # 不依赖 milvus-standalone（跨 profile 非法）：应用对 Milvus 缺席启动有
    # ensure-on-miss 兜底，启动后连上即可自愈
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["app"]
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped

  event-publisher:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    command: ["python", "-m", "workers.event_publisher"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_URI: http://milvus-standalone:19530
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-graph:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    command: ["python", "-m", "workers.graph_indexer"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-knowledgehub123}
      MILVUS_URI: http://milvus-standalone:19530
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  worker-vector:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    command: ["python", "-m", "workers.vector_indexer"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-knowledgehub123}
      MILVUS_URI: http://milvus-standalone:19530
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-draft:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    command: ["python", "-m", "workers.draft_worker"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-knowledgehub123}
      MILVUS_URI: http://milvus-standalone:19530
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V3.2}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
